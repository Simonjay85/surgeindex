# Include this file inside nginx's top-level http{} block.
# It is intentionally separate from the vhost so `limit_req_zone` remains in
# the context nginx requires.
limit_req_zone $binary_remote_addr zone=surgeindex_anonymous:10m rate=30r/m;

# Direct-Nginx mode is the default deployment contract. If Cloudflare is put
# in front, use the official Cloudflare IPv4/IPv6 CIDR list in an additional
# include, set `real_ip_header CF-Connecting-IP`, and set
# `real_ip_recursive on` before loading the SurgeIndex vhost. Never trust
# CF-Connecting-IP from an arbitrary public peer.
