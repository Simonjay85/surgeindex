# Include this file inside nginx's top-level http{} block.
# It is intentionally separate from the vhost so `limit_req_zone` remains in
# the context nginx requires.
limit_req_zone $binary_remote_addr zone=surgeindex_anonymous:10m rate=30r/m;

# Public Fanward pages, the dynamic sitemap, and Fanward APIs all reach
# PostgreSQL. An empty map result is not accounted by limit_req, so applying
# this zone at server scope preserves each vhost's existing routing and staging
# authentication while charging only the exact database-backed URI boundary.
map $uri $surgeindex_fanward_limit_key {
    default "";
    ~^/(?:fanward(?:/|$)|creators(?:/|$)|sitemap\.xml$|api/(?:admin/)?fanward(?:/|$)|(?:dashboard|admin)/fanward(?:/|$)) $binary_remote_addr;
}
limit_req_zone $surgeindex_fanward_limit_key zone=surgeindex_fanward_public:10m rate=120r/m;

# Fanward's reviewed release contract is direct Nginx and rejects every active
# real_ip directive. A future Cloudflare topology needs a separate CIDR-aware
# contract and checker change; do not add real_ip configuration to this release.
