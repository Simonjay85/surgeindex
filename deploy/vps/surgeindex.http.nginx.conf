# Bootstrap vhost used only while the first Let's Encrypt certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name surgeindex.lol www.surgeindex.lol;

    access_log /www/wwwlogs/surgeindex.lol.log;
    error_log /www/wwwlogs/surgeindex.lol.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/surgeindex.lol;
        default_type text/plain;
        try_files $uri =404;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
