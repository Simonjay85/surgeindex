server {
    listen 80;
    listen [::]:80;
    server_name surgeindex.lol www.surgeindex.lol;

    access_log /www/wwwlogs/surgeindex.lol.log;
    error_log /www/wwwlogs/surgeindex.lol.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/surgeindex.lol;
        default_type text/plain;
        try_files $uri =404;
        allow all;
    }

    location / {
        return 301 https://surgeindex.lol$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.surgeindex.lol;

    ssl_certificate /etc/letsencrypt/live/surgeindex.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/surgeindex.lol/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://surgeindex.lol$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name surgeindex.lol;

    ssl_certificate /etc/letsencrypt/live/surgeindex.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/surgeindex.lol/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/surgeindex.lol.ssl.log;
    error_log /www/wwwlogs/surgeindex.lol.ssl.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 75s;
        proxy_cache off;
    }
}
