name: Launch readiness

on:
  push:
    branches: [feat/surgeindex-boost-stripe, fix/launch-readiness]
  pull_request:
    branches: [feat/surgeindex-boost-stripe, fix/launch-readiness]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_MODE: demo
      DATA_PROVIDER: demo
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      BOOST_ENABLED: "false"
      BOOST_LIVE_MODE_ENABLED: "false"
      STRIPE_ENABLED: "false"
      GA4_PROVIDER_MODE: fixture
      SURGEINDEX_NEXT_DIST_DIR: .next-ci
      RELEASE_DB_URL: postgresql://surgeindex_ci@127.0.0.1:5432/surgeindex_ci
      RELEASE_DB_SMOKE_DATABASE_NAME: surgeindex_ci
      RELEASE_DB_SMOKE_ALLOW_SCHEMA_RESET: "true"
      EXPECTED_MIGRATION_COUNT: "14"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: surgeindex_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: surgeindex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U surgeindex_ci -d surgeindex_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm launch:check
      - run: pnpm audit --prod --audit-level high

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_DB_URL: postgresql://surgeindex_ci@127.0.0.1:5432/surgeindex_ci
      RELEASE_DB_SMOKE_DATABASE_NAME: surgeindex_ci
      RELEASE_DB_SMOKE_ALLOW_SCHEMA_RESET: "true"
      EXPECTED_MIGRATION_COUNT: "14"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: surgeindex_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: surgeindex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U surgeindex_ci -d surgeindex_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:smoke
